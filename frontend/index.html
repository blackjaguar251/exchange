function Shell({ children, onHome }) { return h('main', { className: 'app' }, [h('div', { className: 'glow glow-one' }), h('div', { className: 'glow glow-two' }), h('section', { className: 'page' }, [h('header', { className: 'topbar' }, [h('button', { className: 'brand brand-button', onClick: onHome }, [h('div', { className: 'brand-mark' }, '↗'), h('div', null, [h('strong', null, 'rate'), h('span', null, 'exchange')])]), h('div', { className: 'live-pill' }, [h('i'), 'LIVE'])]), children])]); }

function UserPortal({ email, onHome }) { const { data } = useApi('/api/usdt-to-birr'); const rate = data ? Number(data.birr) - Number(data.deduction) : null; const [method, setMethod] = useState('zelle'); const [file, setFile] = useState(null); const [message, setMessage] = useState(''); const [sending, setSending] = useState(false); const [history, setHistory] = useState([]); const loadHistory = () => fetch(`http://localhost:3001/api/receipts?email=${encodeURIComponent(email)}`).then(r => r.json()).then(d => setHistory(d.receipts || [])).catch(() => {}); useEffect(() => { loadHistory(); }, [email]); const submit = e => { e.preventDefault(); if (!file) return setMessage('Choose a receipt first.'); setSending(true); const reader = new FileReader(); reader.onload = () => fetch('http://localhost:3001/api/receipts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: email, paymentMethod: method, fileName: file.name, data: reader.result }) }).then(async r => { const d = await r.json(); if (!r.ok) throw Error(d.error); return d; }).then(() => { setMessage('Confirmed — your receipt was submitted.'); setFile(null); loadHistory(); }).catch(err => setMessage(err.message)).finally(() => setSending(false)); reader.readAsDataURL(file); }; return h(Shell, { onHome }, h('section', { className: 'portal-page' }, [h('div', { className: 'portal-heading' }, [h('div', null, [h('p', { className: 'kicker' }, 'WELCOME BACK'), h('h2', null, email)]), h('button', { className: 'back-button', onClick: onHome }, 'Log out')]), h(SessionBar, { onHome }), h('div', { className: 'mini-rate' }, [h('span', null, 'YOUR RATE'), h('strong', null, rate ? `${money(rate)} ETB` : '—'), h('small', null, 'No transaction fee')]), h('form', { className: 'form-card receipt-form', onSubmit: submit }, [h('p', { className: 'kicker' }, 'PAYMENT RECEIPT'), h('h2', null, 'Confirm your payment'), h('div', { className: 'payment-choices' }, [h('button', { type: 'button', cl function AgentPortal({ email, onHome }) { const { data, error, loading, reload } = useApi('/api/rate'); const [history, setHistory] = useState([]); const loadHistory = () => fetch('http://localhost:3001/api/receipts?role=agent').then(r => r.json()).then(d => setHistory(d.receipts || [])).catch(() => {}); useEffect(() => { loadHistory(); }, []); return h(Shell, { onHome }, h('section', { className: 'portal-page' }, [h('div', { className: 'portal-heading' }, [h('div', null, [h('p', { className: 'kicker' }, 'AGENT DASHBOARD'), h('h2', null, email)]), h('button', { className: 'back-button', onClick: onHome }, 'Log out')]), h(SessionBar, { agent: true, onHome }), h('div', { className: 'agent-rate' }, [h('p', { className: 'kicker' }, 'REALTIME DATABASE RATE'), h('strong', null, loading ? '—' : data?.birr ? money(data.birr) : '—'), h('span', null, 'ETB per 1 USD / USDT'), h('small', null, error ? 'Database unavailable' : `Updated ${clock(data?.created_at)}`)]), h('button', { className: 'refresh-button', onClick: () => { reload(); loadHistory(); } }, 'Refresh database rate  ↻'), h(History, { items: history, agent: true })])); }

function AdminPortal({ email, onHome }) { const { data, error, loading, reload } = useApi('/api/admin/rate'); const [deduction, setDeduction] = useState('9'); const [message, setMessage] = useState(''); useEffect(() => { if (data?.deduction !== undefined) setDeduction(String(data.deduction)); }, [data]); const save = e => { e.preventDefault(); fetch('http://localhost:3001/api/admin/deduction', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deduction: Number(deduction) }) }).then(async r => { const d = await r.json(); if (!r.ok) throw Error(d.error); return d; }).then(() => { setMessage('Saved to database'); reload(); }).catch(err => setMessage(err.message)); }; const raw = data?.birr ? Number(data.birr) : 0; const customer = raw - Number(deduction || 0); return h(Shell, { onHome }, h('section', { className: 'portal-page admin-page' }, [h('div', { className: 'portal-heading' }, [h('div', null, [h('p', { className: 'kicker' }, 'ADMIN DASHBOARD'), h('h2', null, email)]), h('button', { className: 'back-button', onClick: onHome }, 'Log out')]), h(SessionBar, { agent: true }), h('div', { className: 'admin-circle' }, [h('p', { className: 'kicker' }, 'LIVE BINGX RATE'), h('strong', null, loading ? '—' : money(raw)), h('span', null, 'ETB per 1 USD / USDT'), h('small', null, error ? 'Database unavailable' : `Daily rate · Updated ${clock(data?.created_at)}`)]), h('form', { className: 'admin-controls', onSubmit: save }, [h('div', null, [h('p', { className: 'kicker' }, 'CUSTOMER ADJUSTMENT'), h('h2', null, 'Set deduction'), h('span', null, 'This amount is subtracted from the BingX rate.')]), h('div', { className: 'deduction-control' }, [h('span', null, '−'), h('input', { type: 'number', min: '0', step: '0.01', value: deduction, onChange: e => setDeduction(e.target.value) }), h('span', null, 'ETB')]), h('div', { className: 'admin-preview' }, [h('span', null, 'Customer rate'), h('strong', null, money(customer) + ' ETB')]), message && h('p', { className: 'form-message' }, message), h('button', { className: 'primary-button' }, 'Save adjustment')]), h('button', { className: 'refresh-button', onClick: reload }, 'Refresh BingX rate  ↻') ])); }

function Home({ onLogin }) { const { data, error, loading, reload } = useApi('/api/usdt-to-birr'); const rate = data ? Number(data.birr) - Number(data.deduction) : null; const [amount, setAmount] = useState('1'); const converted = useMemo(() => rate ? Number(amount || 0) * rate : 0, [amount, rate]); return h(Shell, { onHome: () => {} }, h('section', { className: 'hero' }, [h('p', { className: 'kicker' }, 'USD / USDT  TO  BIRR'), h('h1', null, 'The rate that moves with you.'), h('p', { className: 'subtitle' }, 'A clear, real-time view of today’s market rate.'), h('div', { className: 'rate-card' }, [h('div', { className: 'rate-card-top' }, [h('span', null, 'CURRENT RATE'), h('span', { className: 'source' }, 'BINGX P2P')]), h('div', { className: 'rate-value' }, [loading && !rate ? '—' : money(rate), h('small', null, 'ETB')]), h('div', { className: 'rate-foot' }, [h('span', null, '1 USD / USDT'), h('span', null, data ? `Updated ${clock(data.created_at)}` : error ? 'Offline' : 'Updating…')])]), h('div', { className: 'no-fee' }, [h('b', null, '✓'), h('span', null, [h('strong', null, 'No transaction fee'), h('small', null, 'What you see is what you get.')])]), h('section', { className: 'converter' }, [h('div', { className: 'section-heading' }, [h('div', null, [h('p', null, 'QUICK CONVERTER'), h('h2', null, 'Know your number')]), h('span', { className: `connection ${error ? 'offline' : ''}` }, [h('i'), error ? 'Offline' : 'Connected'])]), h('label', { className: 'input-wrap' }, [h('span', null, 'USD / USDT'), h('input', { inputMode: 'decimal', value: amount, onChange: e => setAmount(e.target.value) })]), h('div', { className: 'equals' }, '↓'), h('div', { className: 'result-wrap' }, [h('span', null, 'BIRR'), h('strong', null, rate ? money(converted) : '—')])]), h('div', { className: 'login-grid' }, [h('button', { className: 'login-card', onClick: () => onLogin('user') }, [h('span', null, '↗'), h('b', null, 'User login'), h('small', null, 'Upload a receipt')]), h('button', { function App() { const saved = (() => { try { return JSON.parse(localStorage.getItem('exchange_session') || 'null'); } catch { return null; } })(); const [page, setPage] = useState(saved?.adminstatus ? 'admin' : saved?.role || 'home'); const [role, setRole] = useState(saved?.role || null); const [email, setEmail] = useState(saved?.email || ''); const login = selected => { setRole(selected); setPage('login'); }; const done = account => { const session = { role: account.role, email: account.email, adminstatus: account.adminstatus }; localStorage.setItem('exchange_session', JSON.stringify(session)); setEmail(account.email); setPage(account.adminstatus ? 'admin' : account.role); }; const home = () => { localStorage.removeItem('exchange_session'); setPage('home'); setRole(null); setEmail(''); }; if (page === 'login') return h(Login, { role, onBack: home, onLogin: done }); if (page === 'user') return h(UserPortal, { email, onHome: home }); if (page === 'agent') return h(AgentPortal, { email, onHome: home }); if (page === 'admin') return h(AdminPortal, { email, onHome: home }); return h(Home, { onLogin: login }); }
