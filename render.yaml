services:
  - type: web
    name: exchange-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: P2P_ARMY_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: exchange-frontend
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: exchange-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: EXCHANGE_API_URL
        fromService:
          type: web
          name: exchange-backend
          envVarKey: RENDER_EXTERNAL_URL
